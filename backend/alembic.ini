# Alembic config — chạy từ thư mục backend/:  alembic upgrade head
# URL kết nối KHÔNG đặt ở đây (config-only, CLAUDE.md mục 5) —
# migrations/env.py đọc DATABASE_URL từ app.config / biến môi trường.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url =   (cố ý bỏ trống — xem env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
