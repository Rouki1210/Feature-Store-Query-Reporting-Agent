# Alembic config -- run from backend/:  alembic upgrade head
# Connection URL is NOT set here (config-only, CLAUDE.md section 5) --
# migrations/env.py reads DATABASE_URL from app.config / environment.
# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale",
# which on Windows resolves to the ANSI codepage (e.g. cp1258 on a VN locale)
# and would raise UnicodeDecodeError on UTF-8 accented characters.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url =   (intentionally blank -- see env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
