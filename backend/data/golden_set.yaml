cases:
- code: E01
  split: dev
  interaction_type: single_turn
  question_vi: Số chuyến GSM hoàn thành trong 1 tháng gần nhất của từng khách
  difficulty: easy
  category: single_feature
  purpose: 'Sanity Text-to-SQL: đúng Business Unit, metric và window l1m'
  expected_business_unit: GSM
  expected_tables:
  - feature.gsm_transaction
  expected_features:
  - completed_txn_count_l1m
  expected_status: ok
  expected_behavior: execute
  expected_result_shape: table
  expected_visualization: table
  gold_sql: SELECT customer_id, completed_txn_count_l1m FROM feature.gsm_transaction WHERE snapshot_date = (SELECT MAX(snapshot_date)
    FROM feature.gsm_transaction) ORDER BY customer_id LIMIT 100
  sql_assertions:
    must_generate_sql: true
    single_statement: true
    read_only: true
    forbid_select_star: true
    forbid_raw_schema: true
    forbid_pii: true
    require_latest_snapshot: true
    require_join_catalog: false
  evaluation_dimensions:
  - behavior
  - business_unit
  - feature_retrieval
  - sql_semantics
  - sql_safety
  - result_accuracy
  - visualization_selection
