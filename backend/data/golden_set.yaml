metadata:
  name: Feature Store Query & Reporting Agent — Sprint 2 Golden Set
  schema_version: '2.0'
  dataset_version: '2026-07-30'
  language: vi
  database: PostgreSQL
  grain:
    feature.gsm_transaction: customer_id + snapshot_date
    feature.vinfast_transaction: customer_id + snapshot_date
    feature.customer_cross_bu_feature: customer_id + snapshot_date
  counts:
    total: 100
    dev: 70
    holdout: 30
    single_turn: 90
    multi_turn_or_session: 10
  behavior_taxonomy:
  - execute
  - clarify
  - cancel
  - refuse_out_of_scope
  - refuse_insufficient_data
  - reject_safety
  evaluation_policy:
    do_not_compare_sql_by_exact_string_only: true
    required_layers:
    - behavior
    - business_unit
    - feature_retrieval
    - sql_semantics
    - sql_safety
    - result_accuracy
    holdout_tuning_forbidden: true
    holdout_run_policy: Run after prompt/retriever/join-planner/validator versions are locked.
  compatibility:
    expected_status: 'Legacy field retained: ok | clarify | out_of_scope.'
    expected_behavior: Preferred precise behavior field for Sprint 2 evaluation.
