# HOLDOUT (khóa trước khi tune — chống benchmark leakage, Task 1.4). Split lưu bằng
# 1 danh sách code duy nhất; 20/60 case phủ đủ mọi tầng độ khó + category.
holdout:
  [E04, E08, E11, E12, M03, M07, M12, M15, M18, M20, M22, M23,
   H03, H06, H09, G02, G06, G08, G12, G13]

